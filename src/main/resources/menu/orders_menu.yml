    name: "<green>Order <id>"
    lore:
      - "<white>Owner: <yellow><player>"
      - "<white>Required: <yellow><required>"
      - "<white>Delivered: <yellow><delivered>"
      - "<white>Remaining: <yellow><remaining>"
      - "<white>Completed: <yellow><completed>"
      - "<white>Price: <yellow>$<price>"
