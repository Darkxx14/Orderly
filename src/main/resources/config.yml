database:
  type: "SQLITE" # MYSQL or SQLITE

  host: "localhost"
  port: 3306
  database: "orderly"
  username: "root"
  password: ""

  sqlite_file: "plugins/Orderly/orderly.db"

  pool_settings:
    max_pool_size: 8
    min_idle: 2
    connection_timeout: 30000
    idle_timeout: 600000
    max_lifetime: 1800000

# defines how player text input is collected.
#
# types:
#   adaptive - uses dialogs when supported by both server (paper 1.21.7+) and client (1.21.6+), otherwise falls back in the order listed below.
#   dialog - forces dialog input. If dialogs are not supported, the system will warn and use fallback.
#   anvil - always uses anvil input.
#   sign - always uses sign input.
#
# fallback:
#   used when type is adaptive or dialog is forced but unavailable.
text_input:
  type: adaptive
  fallback:
    - anvil
    - sign